name: Admin App Store screenshots
on:
  push:
    branches: [release/admin-ios-store-screenshots]
    paths: ['.github/workflows/admin-store-screenshots.yml', 'scripts/admin-store-screenshots.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: bash scripts/admin-store-screenshots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: amatora-admin-ios-screenshots
          path: artifacts/store-screenshots/
          retention-days: 3
          if-no-files-found: error
